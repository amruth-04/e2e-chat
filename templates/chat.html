<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E2E Encrypted Chat</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.6.1/socket.io.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: #000;
      color: #fff;
      height: 100vh;
      display: flex;
      flex-direction: column;
      max-width: 480px;
      margin: 0 auto;
      border-left: 0.5px solid #262626;
      border-right: 0.5px solid #262626;
    }

    .header {
      padding: 12px 16px;
      border-bottom: 0.5px solid #262626;
      display: flex;
      align-items: center;
      gap: 12px;
      background: #000;
    }

    .avatar-wrap { position: relative; }

    .avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 13px;
      color: #fff;
      flex-shrink: 0;
    }

    .online-dot {
      position: absolute;
      bottom: 1px;
      right: 1px;
      width: 10px;
      height: 10px;
      background: #3bdc6c;
      border-radius: 50%;
      border: 2px solid #000;
    }

    .header-info { flex: 1; }

    .header-name {
      font-size: 15px;
      font-weight: 600;
      color: #fff;
    }

    .header-status {
      font-size: 12px;
      color: #3bdc6c;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .lock-badge {
      font-size: 10px;
      background: #1c1c1c;
      border: 0.5px solid #333;
      border-radius: 20px;
      padding: 2px 8px;
      color: #888;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .sender-pills { display: flex; gap: 6px; }

    .pill {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1.5px solid #333;
      background: transparent;
      color: #888;
      cursor: pointer;
      font-size: 11px;
      font-weight: 600;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .pill.active-alice {
      background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366);
      border-color: transparent;
      color: #fff;
    }

    .pill.active-bob {
      background: linear-gradient(45deg, #405de6, #5851db, #833ab4, #c13584);
      border-color: transparent;
      color: #fff;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .message {
      display: flex;
      flex-direction: column;
      max-width: 72%;
      gap: 3px;
    }

    .message.alice { align-self: flex-end; align-items: flex-end; }
    .message.bob   { align-self: flex-start; align-items: flex-start; }

    .message-bubble {
      padding: 10px 14px;
      border-radius: 22px;
      font-size: 14px;
      line-height: 1.45;
      word-break: break-word;
    }

    .message.alice .message-bubble {
      background: linear-gradient(135deg, #c13584, #833ab4, #5851db, #405de6);
      color: #fff;
      border-bottom-right-radius: 6px;
    }

    .message.bob .message-bubble {
      background: #262626;
      color: #fff;
      border-bottom-left-radius: 6px;
      border: 0.5px solid #333;
    }

    .message-meta {
      font-size: 10px;
      color: #555;
      padding: 0 4px;
      font-family: 'SF Mono', monospace;
      letter-spacing: 0.2px;
    }

    .message.alice .message-meta { text-align: right; }

    .date-divider {
      text-align: center;
      margin: 12px 0;
    }

    .date-divider span {
      font-size: 11px;
      color: #555;
      background: #111;
      padding: 3px 10px;
      border-radius: 10px;
    }

    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 24px;
    }

    .ig-avatar-large {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      margin-bottom: 4px;
    }

    .empty-state h3 {
      font-size: 16px;
      font-weight: 600;
      color: #fff;
    }

    .empty-state p {
      font-size: 13px;
      color: #555;
      text-align: center;
    }

    .crypto-badges {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 6px;
    }

    .cbadge {
      font-size: 11px;
      padding: 3px 10px;
      border-radius: 20px;
      border: 0.5px solid;
    }

    .cbadge-purple { color: #c084fc; border-color: #3b1d6e; background: #1a0f33; }
    .cbadge-pink   { color: #f472b6; border-color: #6b1d4a; background: #2d0f1f; }
    .cbadge-blue   { color: #60a5fa; border-color: #1d3a6b; background: #0f1a2d; }

    .input-area {
      padding: 10px 12px;
      border-top: 0.5px solid #262626;
      display: flex;
      align-items: center;
      gap: 10px;
      background: #000;
    }

    .input-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      background: #1c1c1c;
      border: 0.5px solid #333;
      border-radius: 24px;
      padding: 8px 16px;
      gap: 8px;
    }

    .message-input {
      flex: 1;
      background: transparent;
      border: none;
      color: #fff;
      font-size: 14px;
      outline: none;
      font-family: 'Inter', sans-serif;
    }

    .message-input::placeholder { color: #555; }

    .send-btn {
      background: none;
      border: none;
      color: #3897f0;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      padding: 4px 2px;
      transition: opacity 0.2s;
      flex-shrink: 0;
    }

    .send-btn:hover { opacity: 0.7; }

    ::-webkit-scrollbar { width: 0; }
  </style>
</head>
<body>

<div class="header">
  <div class="avatar-wrap">
    <div class="avatar" id="header-avatar">M1</div>
    <div class="online-dot"></div>
  </div>
  <div class="header-info">
    <div class="header-name" id="header-name">Messenger 1</div>
    <div class="header-status">
      <span>Active now</span>
      <span class="lock-badge">🔒 E2E encrypted</span>
    </div>
  </div>
  <div class="sender-pills">
    <button class="pill active-alice" id="btn-alice" onclick="setSender('alice')" title="Send as Messenger 1">M1</button>
    <button class="pill" id="btn-bob" onclick="setSender('bob')" title="Send as Messenger 2">M2</button>
  </div>
</div>

<div class="messages" id="messages">
  <div class="empty-state" id="empty">
    <div class="ig-avatar-large">🔐</div>
    <h3>E2E Encrypted Chat</h3>
    <p>Messages are secured with X3DH + Double Ratchet.<br>Nobody else can read this conversation.</p>
    <div class="crypto-badges">
      <span class="cbadge cbadge-purple">X3DH handshake</span>
      <span class="cbadge cbadge-pink">Double Ratchet</span>
      <span class="cbadge cbadge-blue">Forward secrecy</span>
    </div>
  </div>
</div>

<div class="input-area">
  <div class="input-wrap">
    <input class="message-input" id="messageInput"
           type="text" placeholder="Message..."
           onkeydown="if(event.key==='Enter') sendMessage()">
    <button class="send-btn" onclick="sendMessage()">Send</button>
  </div>
</div>

<script>
  const socket = io();
  let currentSender = "alice";
  let lastSender = null;

  function setSender(s) {
    currentSender = s;
    document.getElementById("btn-alice").className = "pill" + (s === "alice" ? " active-alice" : "");
    document.getElementById("btn-bob").className   = "pill" + (s === "bob"   ? " active-bob"   : "");
    document.getElementById("header-avatar").textContent = s === "alice" ? "M1" : "M2";
    document.getElementById("header-name").textContent   = s === "alice" ? "Messenger 1" : "Messenger 2";
    document.getElementById("messageInput").placeholder  = `Message as ${s === "alice" ? "Messenger 1" : "Messenger 2"}...`;
  }

  function sendMessage() {
    const input = document.getElementById("messageInput");
    const message = input.value.trim();
    if (!message) return;
    socket.emit("send_message", JSON.stringify({ sender: currentSender, message }));
    input.value = "";
  }

  socket.on("receive_message", (data) => {
    document.getElementById("empty")?.remove();
    const messages = document.getElementById("messages");

    if (lastSender !== data.sender) {
      const div = document.createElement("div");
      div.className = "date-divider";
      div.innerHTML = `<span>${data.sender === "alice" ? "Messenger 1" : "Messenger 2"}</span>`;
      messages.appendChild(div);
      lastSender = data.sender;
    }

    const div = document.createElement("div");
    div.className = `message ${data.sender}`;
    div.innerHTML = `
      <div class="message-bubble">${data.message}</div>
      <span class="message-meta">🔒 ${data.encrypted}</span>
    `;
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
  });
</script>

</body>
</html>
